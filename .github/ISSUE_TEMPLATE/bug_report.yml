name: 🐞 Bug 反馈
description: 面板行为不符合预期、报错、或成绩表数字不对
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把下面的信息填全 —— 面板同时涉及 **DSH**、**LiveBench**、**上游 API** 三层，
        缺信息很难定位。填之前可以先看一眼 `docs/livebench-patches.md`，很多问题是没有打本地补丁导致的。

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: "`npm view dsh-livebench-panel version`，或面板顶部/package.json 里的版本号"
      placeholder: "0.2.17"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 + Node 版本 + Python 版本
      placeholder: "Windows 11 24H2 / Node 22.14 / Python 3.11.15"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      options:
        - 标签页/界面显示
        - 启动评测（/start）
        - 评测过程中的 API 报错
        - 成绩表数字/排序/删除
        - 安装与依赖（LiveBench 检出、venv）
        - 其它
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 你做了什么、期望什么、实际发生了什么
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        面板里展开对应运行记录即可复制；API 报错请给**完整**的 `WARNING`/`Traceback` 段落。
        请自行打码 API Key、baseURL 里的私有域名、请求 id 等敏感信息。
      render: text
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 例如「release 2024-11-25 + language/typos + 起 0 止 0 + 某 provider/模型」
      placeholder: "release=2024-11-25, task=language/typos, 起0 止0, provider=xxx, model=yyy, effort=max"
    validations:
      required: false
