name: 💡 功能建议
description: 希望面板支持的新能力或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景与痛点，不必先想实现方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 如果有具体交互/接口设想，写在这里
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你目前是怎么绕过的
      description: 例如直接改 LiveBench 代码、手写脚本跑评测等
    validations:
      required: false
